name: Check
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: sudo apt-get update && sudo apt-get install -y xvfb x11vnc x11-utils x11-xserver-utils xdotool imagemagick poppler-utils
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: docker build -t vibe-coders:test .
  package:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run package
      - run: bun run check:package
